# Deploys the Supabase Edge Functions whenever their code changes on main.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Settings -> Secrets and variables -> Actions).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:   # adds a "Run workflow" button for manual deploys

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: kghwlzirdufkzmatvgtd   # public project ID, not a secret
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --yes answers the "are you sure?" prompt, which a robot can't do; --remote picks the project.
      - run: supabase functions deploy make-card --remote="$SUPABASE_PROJECT_ID" --yes
